# capacity sweep against the postgres-backed demo stack — finds the
# concurrency where latency breaks instead of guessing it.
#
# Needs:
#   1. postgres with the barrage_demo db (tables: products, orders)
#   2. POSTGRES_DSN=postgres://barrage_app:<pass>@localhost:5432/barrage_demo?sslmode=disable
#      go run ./cmd/demoserver   (in one terminal, :8080, db: connected)
# Then:
#   barrage run -c examples/capacity-pg.yaml
#
# Put your real password in `conn` below (it is yours, not committed).
# scenario IS the HTTP load here (http: cannot be combined with scenario:).
duration: 20s # kept for normal runs; a capacity sweep uses step_duration per level
bucket_width: 1s
ramp: 0s
concurrency: 5 # sweep start: first crowd level tried

capacity:
  max_concurrency: 40 # doubling 5, 10, 20, 40, then fine fill inside the break
  step_duration: 10s # short burst per level, not the full duration

scenario:
  - name: browse
    weight: 70
    steps:
      - method: GET
        url: http://localhost:8080/api/products
      - method: GET
        url: http://localhost:8080/api/orders

  - name: checkout-flow
    weight: 30
    steps:
      - method: POST
        url: http://localhost:8080/api/login
        body: '{"user":"alice"}'
        headers:
          Content-Type: application/json
        extract:
          token: $.token
      - method: GET
        url: http://localhost:8080/api/checkout?token={{token}}
        headers:
          Authorization: Bearer {{token}}

db:
  rate: 20 # total q/s at start; scales with concurrency per level
  target:
    driver: postgres
    conn: postgres://barrage_app:CHANGE_ME@localhost:5432/barrage_demo?sslmode=disable
    max_open_conns: 40 # size once to max so levels reuse warm connections
    max_idle_conns: 40
    queries:
      - query: SELECT id, name, price FROM products ORDER BY id
        weight: 20
        type: read
      - query: SELECT count(*) FROM orders
        weight: 20
        type: read
      - query: SELECT id, customer, amount FROM orders ORDER BY id DESC LIMIT 20
        weight: 30
        type: read
      - query: INSERT INTO orders (customer, amount) VALUES ('load', 1)
        weight: 20
        type: write
      - query: UPDATE orders SET amount = amount + 1 WHERE id = 1
        weight: 10
        type: write