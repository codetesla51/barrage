# Demo stack validation — builds the docker-compose reference stack on a
# hosted runner and runs the full-stack profile end to end. Manual trigger
# only. Green here means the Dockerfile + docker-compose.yml + configs are
# correct, so `docker compose up --build` works the same on any machine
# that has Docker with the compose plugin.
name: demo stack validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: validate compose file
        run: docker compose -f docker-compose.yml config --quiet

      - name: build images
        run: docker compose -f docker-compose.yml build

      - name: run full-stack profile
        # starts postgres+redis, seeds 1M rows, boots the demo app, then
        # runs the barrage profile inside the compose network; exits with
        # barrage's exit code so failures are loud.
        run: docker compose -f docker-compose.yml up --exit-code-from barrage barrage

      - name: show run summary
        run: |
          ls -la reports/
          echo '---- results.json (head) ----'
          head -15 reports/results.json

      - name: upload reports
        uses: actions/upload-artifact@v4
        with:
          name: demo-reports
          path: reports/
          if-no-files-found: error