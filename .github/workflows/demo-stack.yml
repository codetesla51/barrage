# Demo stack validation — builds the docker-compose reference stack on a
# hosted runner and runs a profile end to end. Manual trigger only. Green
# here means the Dockerfile + docker-compose.yml + configs are correct, so
# `docker compose up --build` behaves the same on any machine with Docker +
# the compose plugin.
name: demo stack validation

on:
  workflow_dispatch:
    inputs:
      profile:
        description: config in docker/configs/ to run against the stack
        required: false
        default: demo.yaml

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    env:
      PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v4

      - name: validate compose file
        run: docker compose -f docker-compose.yml config --quiet

      - name: build images
        run: docker compose -f docker-compose.yml build

      - name: run profile against the stack
        # bring data stores + app up (waits for postgres/redis/demoserver
        # healthy, and seeddb to finish), then run the chosen profile as a
        # one-shot from the barrage image; reports land in ./reports/.
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml up -d --wait postgres redis seeddb demoserver
          docker compose -f docker-compose.yml run --rm barrage run \
            -c "/configs/$PROFILE" --no-progress \
            --json /out/results.json --report /out/report.html
          docker compose -f docker-compose.yml down

      - name: show run summary
        run: |
          ls -la reports/
          echo '---- results.json (head) ----'
          head -15 reports/results.json

      - name: upload reports
        uses: actions/upload-artifact@v4
        with:
          name: demo-reports
          path: reports/
          if-no-files-found: error