# berth capacity sweep — runs the any/ro/rw sweeps on a hosted GitHub
# runner (Azure US), so the measured path is short to the Fly.io edge
# instead of crossing an ocean. Manual trigger only. DSNs come from repo
# secrets (BERTH_DSN_ANY / BERTH_DSN_RO / BERTH_DSN_RW) and never touch a
# committed file. Results upload as artifacts.
#
# Workload: profiles/berth-queries.yaml (catalog reads) are always used;
# profiles/berth-writes.yaml (INSERTs into public.barrage_load) are appended
# for write-capable endpoints (any, rw — never ro) when include_writes=yes.
# warmup_s runs one short burst per host first so scaled-to-zero Neon
# computes are warm before the real levels (rw's first-burst cold start
# otherwise pollutes the scan).
name: berth capacity sweep

on:
  workflow_dispatch:
    inputs:
      db_threshold:
        description: P99 budget in ms (a level is broken when its p99 exceeds this)
        required: false
        default: "300"
      max_concurrency:
        description: highest concurrency level to probe
        required: false
        default: "50"
      step_duration:
        description: seconds per level burst
        required: false
        default: "10"
      include_writes:
        description: also append the write workload (any + rw only; creates the barrage_load table)
        required: false
        default: "no"
      warmup_s:
        description: seconds of warm-up load per host before the sweep (0 disables)
        required: false
        default: "10"
      pool_size:
        description: "fixed client connection pool (max_open_conns). 0 = one connection per worker (direct). A positive value tests pooled requests; concurrency above the pool size queues on connections, like a real app's DB pool."
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      ANY_DSN: ${{ secrets.BERTH_DSN_ANY }}
      RO_DSN: ${{ secrets.BERTH_DSN_RO }}
      RW_DSN: ${{ secrets.BERTH_DSN_RW }}
      DB_THRESHOLD: ${{ inputs.db_threshold }}
      MAX_CONCURRENCY: ${{ inputs.max_concurrency }}
      STEP_DURATION: ${{ inputs.step_duration }}
      INCLUDE_WRITES: ${{ inputs.include_writes }}
      WARMUP_S: ${{ inputs.warmup_s }}
      POOL_SIZE: ${{ inputs.pool_size }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build barrage
        run: go build -o /tmp/barrage ./cmd/barrage

      - name: ensure benchmark table (writes only)
        if: inputs.include_writes == 'yes'
        # rw is the only guaranteed write path in this HA setup: ro is
        # read-only and any can land on a read-only compute.
        run: go run ./profiles/pgschema "$RW_DSN"

      - name: sweep any/ro/rw
        id: sweep
        run: |
          set -euo pipefail
          mkdir -p /tmp/results
          for name in any ro rw; do
            case "$name" in
              any) dsn="$ANY_DSN" ;;
              ro)  dsn="$RO_DSN" ;;
              rw)  dsn="$RW_DSN" ;;
            esac
            [ -n "$dsn" ] || { echo "::error::missing secret for $name"; exit 1; }

            # warm-up burst first (wakes scaled-to-zero compute, warms the pool)
            if [ "$WARMUP_S" -gt 0 ] && [ "$WARMUP_S" != "0" ]; then
              {
                echo "duration: ${WARMUP_S}s"
                echo "concurrency: 5"
                echo "bucket_width: 1s"
                echo "db:"
                echo "  rate: 10"
                echo "  target:"
                echo "    driver: postgres"
                echo "    conn: $dsn"
                if [ "$POOL_SIZE" -gt 0 ]; then
                  echo "    max_open_conns: $POOL_SIZE"
                fi
                cat profiles/berth-queries.yaml
              } > "/tmp/$name-warmup.yaml"
              echo "---- warm-up: $name (${WARMUP_S}s) ----"
              /tmp/barrage run -c "/tmp/$name-warmup.yaml" \
                --db-threshold "${DB_THRESHOLD}ms" --no-progress \
                --json "/tmp/results/warmup-$name.json" || true
            fi

            {
              echo "duration: 60s"
              echo "concurrency: 5"
              echo "bucket_width: 1s"
              echo "capacity:"
              echo "  max_concurrency: $MAX_CONCURRENCY"
              echo "  step_duration: ${STEP_DURATION}s"
              echo "db:"
              echo "  rate: 10"
              echo "  target:"
              echo "    driver: postgres"
              echo "    conn: $dsn"
              if [ "$POOL_SIZE" -gt 0 ]; then
                echo "    max_open_conns: $POOL_SIZE"
              fi
              cat profiles/berth-queries.yaml
              if [ "$INCLUDE_WRITES" = "yes" ] && [ "$name" = "rw" ]; then
                cat profiles/berth-writes.yaml
              fi
            } > "/tmp/$name.yaml"
            echo "========== SWEEP: $name =========="
            /tmp/barrage run -c "/tmp/$name.yaml" \
              --db-threshold "${DB_THRESHOLD}ms" --no-progress \
              --json "/tmp/results/$name.json" --report "/tmp/results/$name-report.html" || true
          done

      - name: summary
        run: |
          summary=$(mktemp)
          for name in any ro rw; do
            jf="/tmp/results/$name.json"
            if [ -s "$jf" ]; then
              jq -r --arg n "$name" --arg f "$jf" \
                '"\($n): broke at concurrency \(.capacity_search.break_at) | last ok \(.capacity_search.last_ok)"' \
                "$jf" >> "$summary"
            else
              echo "$name: no results (failed above)" >> "$summary"
            fi
          done
          {
            echo "## Sweep verdicts"
            echo '```'
            cat "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload results
        uses: actions/upload-artifact@v4
        with:
          name: sweep-results
          path: /tmp/results/
          if-no-files-found: error