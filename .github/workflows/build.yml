name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true

      - name: Build binary
        run: |
          mkdir -p dist
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          out="dist/barrage-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          ldflags="-s -w -X github.com/codetesla51/barrage/cmd/barrage.main.version=$(git describe --tags --always 2>/dev/null || echo dev)"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -ldflags "$ldflags" -o "$out" ./cmd/barrage
          echo "binary=$out" >> "$GITHUB_OUTPUT"
        id: build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: barrage-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.build.outputs.binary }}
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true

      - name: Build release binaries
        run: |
          mkdir -p dist
          ldflags="-s -w -X github.com/codetesla51/barrage/cmd/barrage.main.version=${GITHUB_REF_NAME}"
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$ldflags" -o dist/barrage-linux-amd64 ./cmd/barrage
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$ldflags" -o dist/barrage-linux-arm64 ./cmd/barrage
          GOOS=darwin  GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$ldflags" -o dist/barrage-darwin-amd64 ./cmd/barrage
          GOOS=darwin  GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$ldflags" -o dist/barrage-darwin-arm64 ./cmd/barrage
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$ldflags" -o dist/barrage-windows-amd64.exe ./cmd/barrage

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
