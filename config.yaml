# Barrage load-test configuration.
#
# All runner sections are optional: omit any of `http`, `db`, or `redis` to run
# only the others. At least one section must be present. Unknown keys are
# rejected.
#
# Durations use Go's time.ParseDuration format, e.g. 10s, 1m30s, 500ms.

duration: 15s
bucket_width: 1s
ramp: 3s # linearly ramp the rate from 0 to full over this long
concurrency: 10 # worker count for the db/redis pools and http attackers

# Swap the single run for a capacity sweep (find where latency breaks) by
# uncommenting capacity: — concurrency becomes the search start, and the
# sweep doubles upward until max_concurrency, probing each level for
# step_duration. See README "Capacity sweep" for how the verdict works.
# capacity:
#   max_concurrency: 160 # search cap; the sweep stops here
#   step_duration: 10s   # burst time per concurrency level

http:
  rate: 10 # requests per second
  target:
    method: POST
    url: http://localhost:8080/api/orders
    body: '{"customer": 42}'
    header:
      content-type: [application/json]
      authorization: [Bearer some-token]

db:
  rate: 5 # queries per second
  target:
    driver: postgres
    conn: postgres://us:2@localhost:5432/testDB?sslmode=disable
    # pool tuning (all optional): unset counts default to concurrency,
    # unset lifetimes leave the driver default. max_open_conns: -1 removes
    # the cap entirely (unlimited). Keep max_open_conns at or below the
    # database's max_connections unless you really want no cap.
    # max_open_conns: 10
    # max_idle_conns: 10
    # conn_max_lifetime: 5m
    # conn_max_idle_time: 30s
    queries:
      - query: SELECT count(*) FROM orders
        weight: 20
        type: read
      - query: SELECT customer, amount FROM orders LIMIT 10
        weight: 20
        type: read
      - query: SELECT amount FROM orders WHERE id = 1
        weight: 15
        type: read
      - query: INSERT INTO orders (customer, amount) VALUES ('load', 1)
        weight: 25
        type: write
      - query: UPDATE orders SET amount = amount + 1 WHERE id = 1
        weight: 20
        type: write

redis:
  rate: 20 # commands per second
  target:
    addr: "localhost:6379"
    db: 0
    queries:
      - query: PING
        weight: 1
