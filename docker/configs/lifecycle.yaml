# Full user-lifecycle + capacity sweep ("auto ramp") against the compose
# demo stack. Exercises everything the stack can do: multi-step journeys
# with auth tokens (VUs), weighted DB reads/writes, and Redis commands —
# all on one clock, then lets the sweep raise concurrency until something
# breaks. capacity: is what auto_ramp: became in 0.6.
#
# Run by: docker compose run --rm barrage run -c /configs/lifecycle.yaml \
#            --json /out/results.json --report /out/report.html
#    or via the demo-stack workflow with profile=lifecycle
duration: 15s        # ignored during a sweep; key is required
bucket_width: 1s
ramp: 0s             # sweeps force the ramp off; key is required
concurrency: 5       # sweep start
capacity:            # auto-ramp: doubles, then fine-fills to the knee
  max_concurrency: 200
  step_duration: 10s

scenario:
  - name: browse
    weight: 60
    steps:
      - method: GET
        url: http://demoserver:8080/api/products
      - method: GET
        url: http://demoserver:8080/api/orders

  - name: checkout-flow
    weight: 40
    steps:
      - method: POST
        url: http://demoserver:8080/api/login
        headers:
          Content-Type: application/json
        extract:
          token: $.token
      - method: GET
        url: http://demoserver:8080/api/me
        headers:
          Authorization: Bearer {{token}}
      - method: POST
        url: http://demoserver:8080/api/orders
        body: '{"amount":1}'
        headers:
          Content-Type: application/json
      - method: GET
        url: http://demoserver:8080/api/checkout?token={{token}}
        headers:
          Authorization: Bearer {{token}}

db:
  rate: 40            # scaled up with each sweep level
  target:
    driver: postgres
    conn: postgres://barrage:barrage@postgres:5432/barrage_demo?sslmode=disable
    max_open_conns: 20
    queries:
      - query: SELECT count(*) FROM orders
        weight: 2
        type: read
      - query: SELECT id, customer, amount FROM orders ORDER BY id DESC LIMIT 20
        weight: 2
        type: read
      - query: INSERT INTO orders (customer, amount) VALUES ('load', 1) RETURNING id
        weight: 1
        type: write

redis:
  rate: 100
  target:
    addr: redis:6379
    queries:
      - query: PING
        weight: 3
      - query: SET sess:demo ok
        weight: 1
      - query: INCR demo:hits
        weight: 2